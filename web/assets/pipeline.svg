<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Imaging, clinical, and neural fusion pathways</title>
  <desc id="desc">DCE-MRI phases enter a compact CNN. Mean aggregation creates a 64-dimensional patient embedding. Age and HR are encoded into four features. A clinical-only logistic model is a separate comparator; an eight-dimensional clinical branch joins the image embedding for neural fusion.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8098aa"/></marker><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#bdd3e2" stroke-width=".6"/></pattern></defs>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#142e46">
    <g fill="#fff" stroke="#c4d8e5"><rect x="17" y="35" width="57" height="69" rx="3"/><rect x="29" y="27" width="57" height="69" rx="3"/><rect x="41" y="19" width="57" height="69" rx="3" fill="url(#grid)"/></g>
    <text x="17" y="126" font-weight="600">DCE-MRI phases</text><text x="17" y="145" fill="#536c80" font-size="11">PRE / EARLY / LATE</text>
    <g fill="#d9eef3" stroke="#157b93"><rect x="173" y="31" width="16" height="64" rx="2"/><rect x="197" y="38" width="23" height="50" rx="2"/><rect x="228" y="45" width="29" height="36" rx="2"/><rect x="265" y="51" width="36" height="24" rx="2"/></g>
    <text x="171" y="126" font-weight="600">Compact CNN</text><text x="171" y="145" fill="#536c80" font-size="11">8 / 16 / 32 / 64 channels</text>
    <g fill="none" stroke="#8098aa" stroke-width="1.6" marker-end="url(#arrow)"><path d="M108 62H158"/><path d="M311 62H355"/><path d="M503 62H555"/><path d="M717 62H765"/></g>
    <rect x="367" y="30" width="136" height="65" rx="4" fill="#fff" stroke="#c4d8e5"/><text x="435" y="54" text-anchor="middle" font-weight="600">Mean aggregation</text><text x="435" y="75" text-anchor="middle" fill="#536c80" font-size="11">spatial, then across slices</text>
    <rect x="567" y="30" width="150" height="65" rx="4" fill="#d9eef3" stroke="#157b93"/><text x="642" y="54" text-anchor="middle" font-weight="600">Patient embedding</text><text x="642" y="75" text-anchor="middle" fill="#157b93" font-size="12">64 values</text>
    <rect x="778" y="37" width="138" height="50" rx="4" fill="#fff" stroke="#157b93"/><text x="847" y="58" text-anchor="middle" font-weight="600">Image-only head</text><text x="847" y="75" text-anchor="middle" fill="#536c80" font-size="11">pCR probability</text>
    <rect x="17" y="206" width="124" height="59" rx="4" fill="#fff" stroke="#bba8d3"/><text x="79" y="231" text-anchor="middle" font-weight="600">Age + HR</text><text x="79" y="250" text-anchor="middle" fill="#536c80" font-size="11">pretreatment variables</text>
    <rect x="193" y="206" width="160" height="59" rx="4" fill="#eee8f6" stroke="#7654a4"/><text x="273" y="229" text-anchor="middle" font-weight="600">Clinical encoding</text><text x="273" y="248" text-anchor="middle" fill="#7654a4" font-size="11">2 scaled + 2 missing flags</text>
    <g fill="none" stroke="#8098aa" stroke-width="1.6" marker-end="url(#arrow)"><path d="M141 235H181"/><path d="M353 235H403"/><path d="M377 235V160H555"/><path d="M642 95V129"/><path d="M728 160H765"/></g><circle cx="377" cy="235" r="3" fill="#7654a4"/><text x="403" y="148" font-size="11" fill="#7654a4">Clinical branch: 4 → 8</text>
    <rect x="415" y="207" width="104" height="57" rx="4" fill="#fff" stroke="#7654a4"/><text x="467" y="231" text-anchor="middle" font-weight="600">Clinical only</text><text x="467" y="250" text-anchor="middle" fill="#536c80" font-size="11">logistic regression</text>
    <rect x="567" y="135" width="161" height="52" rx="4" fill="#e2ebfb" stroke="#245cbb"/><text x="647" y="156" text-anchor="middle" font-weight="600">Neural fusion</text><text x="647" y="175" text-anchor="middle" fill="#245cbb" font-size="11">64 image + 8 clinical values</text>
    <rect x="778" y="135" width="138" height="52" rx="4" fill="#fff" stroke="#245cbb"/><text x="847" y="157" text-anchor="middle" font-weight="600">Fusion head</text><text x="847" y="176" text-anchor="middle" fill="#536c80" font-size="11">pCR probability</text>
    <text x="567" y="232" font-size="11" fill="#536c80">The clinical branch maps 4 encoded features to 8 values.</text><text x="567" y="252" font-size="11" fill="#536c80">Frozen image embeddings preserve the imaging extractor.</text>
    <g font-size="11" fill="#536c80"><text x="947" y="57">Separate</text><text x="947" y="74">comparators</text><text x="947" y="155">Combined</text><text x="947" y="172">representation</text></g>
  </g>
</svg>
