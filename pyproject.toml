[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breastdce-research"
version = "0.1.0"
description = "Research-only patient-level DCE-MRI CNN and clinical fusion"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.1.3", "pandas==2.3.3", "scipy==1.17.1", "scikit-learn==1.8.0", "torch==2.10.0", "Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
plots = ["matplotlib==3.10.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
